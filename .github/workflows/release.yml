name: Build and Release

on:
  push:
    tags:
      - 'v*' # Sadece v ile başlayan tag'lerde çalışır (ör. v1.0.0)

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: fenrir-linux
            asset_name: fenrir-linux
          - os: windows-latest
            artifact_name: fenrir.exe
            asset_name: fenrir-windows.exe

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release -DFENRIR_USE_OPENCL=OFF

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release

    - name: Rename Artifact (Windows)
      if: matrix.os == 'windows-latest'
      run: copy ${{github.workspace}}\build\Release\fenrir.exe ${{github.workspace}}\build\Release\${{ matrix.asset_name }}

    - name: Rename Artifact (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: cp ${{github.workspace}}/build/fenrir ${{github.workspace}}/build/${{ matrix.asset_name }}

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{github.workspace}}/build/Release/${{ matrix.asset_name }}
          ${{github.workspace}}/build/${{ matrix.asset_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
